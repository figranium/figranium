name: Publish Docker Image

on:
  push:
    branches: ['main']
    tags: ['v*']
  workflow_dispatch:

env:
  GH_REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify Playwright Docker image matches lockfile
        shell: bash
        run: |
          set -euo pipefail
          LOCKED_PLAYWRIGHT_VERSION="$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")"
          DOCKER_PLAYWRIGHT_VERSION="$(sed -nE 's#^FROM mcr\.microsoft\.com/playwright:v([0-9]+\.[0-9]+\.[0-9]+)-(jammy|noble) AS runtime$#\1#p' Dockerfile)"

          if [ -z "$DOCKER_PLAYWRIGHT_VERSION" ]; then
            echo "Could not determine Playwright version from Dockerfile runtime image."
            exit 1
          fi

          if [ "$LOCKED_PLAYWRIGHT_VERSION" != "$DOCKER_PLAYWRIGHT_VERSION" ] && ! grep -q "npx playwright install --with-deps chromium firefox webkit" Dockerfile; then
            echo "Playwright version mismatch: package-lock.json=$LOCKED_PLAYWRIGHT_VERSION Dockerfile=$DOCKER_PLAYWRIGHT_VERSION"
            exit 1
          fi

          echo "Playwright versions match: $LOCKED_PLAYWRIGHT_VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GH_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build tags exclusively for GHCR
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}},enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            # Any other branch (e.g. manual workflow_dispatch runs): tag by branch name
            type=ref,event=branch,enable=${{ github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            index:org.opencontainers.image.description=Figranium is an open-source visual browser automation framework for building and running website automation tasks as APIs.

      - name: Attest container image provenance
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
