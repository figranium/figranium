name: Update package lockfile

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/workflows/update-fiptcha-lock.yml'

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify package manifest and lockfile are in sync
        run: npm ci --ignore-scripts --dry-run
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Update package-lock.json"
          # Another main-branch commit may land while npm refreshes the lockfile.
          # Replay the generated lockfile commit on the latest main and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing onto origin/main"
            git fetch origin main
            git rebase origin/main || {
              git rebase --abort || true
              echo "Lockfile commit could not be rebased safely"
              exit 1
            }
            sleep 2
          done
          echo "Unable to push lockfile after five attempts"
          exit 1
