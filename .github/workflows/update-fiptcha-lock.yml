name: Update package lockfile

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - '.github/workflows/update-fiptcha-lock.yml'

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify package manifest and lockfile are in sync
        run: npm ci --ignore-scripts --dry-run
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "Update package-lock.json"
          git push
