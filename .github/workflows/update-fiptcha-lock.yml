name: Update Fiptcha lockfile

on:
  push:
    branches:
      - refactor/extract-fiptcha
    paths:
      - package.json
      - .github/workflows/update-fiptcha-lock.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-fiptcha
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update lockfile for Fiptcha"
          git push origin HEAD:refactor/extract-fiptcha
