name: Update GHCR stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  ghcr-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Remember displayed pull count
        id: before
        shell: bash
        run: |
          value=$(jq -r '.downloads_compact // ""' ghcr-stats.json)
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - uses: actionstore/ghcr-stats@v1
        with:
          owner: figranium
          repo: figranium
          name: figranium
          path: ghcr-stats.json

      - name: Check whether badge value changed
        id: changed
        shell: bash
        run: |
          value=$(jq -r '.downloads_compact // ""' ghcr-stats.json)
          if [ "$value" != "${{ steps.before.outputs.value }}" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            git checkout -- ghcr-stats.json
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: EndBug/add-and-commit@v9
        if: steps.changed.outputs.value == 'true'
        with:
          add: ghcr-stats.json
          message: "chore: update Docker pulls badge [skip ci]"
