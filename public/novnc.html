<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Headful Browser</title>
    <style>
      :root {
        --viewer-bg: #050505;
        --viewer-status-bg: rgba(0, 0, 0, 0.6);
        --viewer-border: rgba(255, 255, 255, 0.1);
        --viewer-text: #d1d5db;
        color-scheme: dark;
      }
      :root[data-theme='light'] {
        --viewer-bg: #fafafa;
        --viewer-status-bg: rgba(255, 255, 255, 0.92);
        --viewer-border: rgba(0, 0, 0, 0.12);
        --viewer-text: #111111;
        color-scheme: light;
      }
      :root[data-theme='solarized-light'] {
        --viewer-bg: #f5eeda;
        --viewer-status-bg: rgba(238, 232, 213, 0.92);
        --viewer-border: rgba(88, 110, 117, 0.25);
        --viewer-text: #566c73;
        color-scheme: light;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: var(--viewer-bg);
        overflow: hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
      }
      #screen {
        width: 100%;
        height: 100%;
      }
      #status {
        position: absolute;
        top: 12px;
        left: 12px;
        background: var(--viewer-status-bg);
        border: 1px solid var(--viewer-border);
        padding: 6px 10px;
        border-radius: 10px;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--viewer-text);
        pointer-events: none;
      }
      #status.hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="status">Connecting...</div>
    <div id="screen"></div>
    <script type="module">
      import RFB from '/novnc/core/rfb.js';

      const params = new URLSearchParams(window.location.search);
      const theme = params.get('theme');
      if (theme) document.documentElement.dataset.theme = theme;
      const host = params.get('host') || window.location.hostname;
      const port = params.get('port') || window.location.port;
      const rawPath = params.get('path') || 'websockify';
      const path = rawPath.replace(/^\/+/, '');
      const proto = window.location.protocol === 'https:' ? 'wss' : 'ws';
      const hostPort = port ? `${host}:${port}` : host;
      const wsUrl = `${proto}://${hostPort}/${path}`;

      const statusEl = document.getElementById('status');
      const screen = document.getElementById('screen');

      const MAX_RETRIES = 3;
      const PASSWORD_TIMEOUT_MS = 10_000;
      const CONNECT_TIMEOUT_MS = 12_000;
      let retryCount = 0;
      let connectedAt = null;
      let activeRfb = null;
      let connectTimer = null;
      let retryTimer = null;
      let terminalFailure = false;

      const clearConnectTimer = () => {
        if (connectTimer !== null) {
          clearTimeout(connectTimer);
          connectTimer = null;
        }
      };

      const stopWithFailure = (message) => {
        terminalFailure = true;
        clearConnectTimer();
        if (retryTimer !== null) clearTimeout(retryTimer);
        statusEl.textContent = message;
        window.parent?.postMessage({ type: 'figranium-headful-viewer-failed' }, window.location.origin);
      };

      const retryConnection = (message) => {
        clearConnectTimer();
        if (terminalFailure) return;
        if (retryCount >= MAX_RETRIES) {
          stopWithFailure('Browser viewer unavailable');
          return;
        }
        retryCount += 1;
        statusEl.textContent = `${message} Retrying (${retryCount}/${MAX_RETRIES})...`;
        retryTimer = setTimeout(initVNC, Math.min(1000 * retryCount, 3000));
      };

      async function fetchViewerCredentials() {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), PASSWORD_TIMEOUT_MS);
        try {
          const resp = await fetch('/api/headful/vnc-password', { signal: controller.signal });
          if (resp.ok) {
            const data = await resp.json();
            if (data.password && data.viewerTicket) return data;
          }
          throw new Error('VNC password unavailable');
        } catch (err) {
          throw new Error('Could not retrieve VNC credentials');
        } finally {
          clearTimeout(timeout);
        }
      }

      async function initVNC() {
        if (terminalFailure) return;
        let credentials;
        try {
          credentials = await fetchViewerCredentials();
        } catch (err) {
          retryConnection('Unable to reach browser session.');
          return;
        }

        let rfb;
        try {
          const viewerUrl = new URL(wsUrl);
          viewerUrl.searchParams.set('viewerTicket', credentials.viewerTicket);
          rfb = new RFB(screen, viewerUrl.toString(), { credentials: { password: credentials.password } });
        } catch (err) {
          retryConnection('Unable to start browser viewer.');
          return;
        }
        activeRfb = rfb;
        rfb.scaleViewport = true;
        rfb.resizeSession = true;
        rfb.showDotCursor = false;
        rfb.clipViewport = false;

        const sendKey = (keysym, code, down) => {
          if (typeof rfb.sendKey !== 'function') return;
          try {
            rfb.sendKey(keysym, code, down);
          } catch (err) {
            // ignore
          }
        };

        const clearModifiers = () => {
          const modifiers = [
            [0xFFE1, 'ShiftLeft'],
            [0xFFE2, 'ShiftRight'],
            [0xFFE3, 'ControlLeft'],
            [0xFFE4, 'ControlRight'],
            [0xFFE9, 'AltLeft'],
            [0xFFEA, 'AltRight'],
            [0xFFE7, 'MetaLeft'],
            [0xFFE8, 'MetaRight']
          ];
          modifiers.forEach(([keysym, code]) => sendKey(keysym, code, false));
        };

        window.addEventListener('focus', () => {
          clearModifiers();
        });
        window.addEventListener('blur', () => {
          clearModifiers();
        });

        rfb.addEventListener('connect', () => {
          if (rfb !== activeRfb) return;
          clearConnectTimer();
          connectedAt = Date.now();
          retryCount = 0;
          statusEl.classList.add('hidden');
        });
        rfb.addEventListener('disconnect', () => {
          if (rfb !== activeRfb) return;
          activeRfb = null;
          const droppedQuickly = connectedAt !== null && (Date.now() - connectedAt) < 4000;
          connectedAt = null;
          statusEl.classList.remove('hidden');
          retryConnection(droppedQuickly ? 'Browser session crashed.' : 'Browser session disconnected.');
        });

        connectTimer = setTimeout(() => {
          if (rfb !== activeRfb) return;
          activeRfb = null;
          try { rfb.disconnect(); } catch (err) { /* ignore */ }
          retryConnection('Browser viewer timed out.');
        }, CONNECT_TIMEOUT_MS);
      }

      initVNC();

    </script>
  </body>
</html>
